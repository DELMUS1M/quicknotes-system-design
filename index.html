<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes System Client</h1>
    <p>API Integration test harness for JSONPlaceholder backend</p>
  </header>

  <main>
    <!-- Status Paragraph for Loading, Success, and Error messages -->
    <p id="status" class="status-msg" aria-live="polite"></p>

    <!-- Section 1: Create Note Form -->
    <section class="card">
      <h2>Create New Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title <span class="required">*</span></label>
          <input type="text" id="title-input" placeholder="Note title (max 100 chars)..." maxlength="100" required>
        </div>

        <div class="form-group">
          <label for="body-input">Body</label>
          <textarea id="body-input" rows="4" placeholder="Note content (optional)..."></textarea>
        </div>

        <button id="submit-btn" type="submit">Create Note</button>
      </form>
    </section>

    <!-- Section 2: Load & Display Notes -->
    <section class="card">
      <div class="section-header">
        <h2>Server Notes</h2>
        <button id="load-btn" type="button">Load notes</button>
      </div>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes System Design Capstone.</p>
  </footer>

</body>
</html>
